<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="workflow-revision" content="__REVISION__">
<title>__TITLE__ · Implementation workflow</title>
<style>
:root{
  --bg:#f7f5f4;--surface:#fff;--inset:#ece9e6;--border:#dad5d1;--border-strong:#c1bbb6;
  --text:#2c2c2c;--text-2:#606060;--muted:#655d58;--faint:#a19a94;--heading:#000;
  --accent:#0d6fe1;--accent-bg:#cfe2ff;--ok:#066a2c;--ok-bg:#e5f7e7;--bad:#921921;--bad-bg:#ffe4e1;--warn:#7a4b00;--warn-bg:#fff1d6;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--serif:"Libre Baskerville",Georgia,serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
  --k:#cf222e;--t:#8250df;--l:#0550ae;--s:#0a3069;--v:#953800;--c:#57606a;--g:#116329;
}
[data-theme=dark]{
  --bg:#000;--surface:#161412;--inset:#2c2c2c;--border:#2c2c2c;--border-strong:#606060;
  --text:#f7f5f4;--text-2:#dad5d1;--muted:#c1bbb6;--faint:#a19a94;--heading:#fff;
  --accent:#3d8cff;--accent-bg:#0d2c58;--ok:#81d090;--ok-bg:#072810;--bad:#fb8d87;--bad-bg:#330b0b;--warn:#ffcf7a;--warn-bg:#3a2a05;
  --k:#ff7b72;--t:#d2a8ff;--l:#79c0ff;--s:#a5d6ff;--v:#ffa657;--c:#a8b1bb;--g:#7ee787;
}
*{box-sizing:border-box}html{background:var(--bg);color:var(--text);font-family:var(--sans)}body{margin:0}button{font:inherit}
header.app{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;background:color-mix(in srgb,var(--surface) 94%,transparent);border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.brand{font-size:14px;font-weight:600;color:var(--heading)}
.tabs{display:flex;align-self:stretch;margin-left:8px}.tabs button{height:56px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;color:var(--text-2);cursor:pointer;font-size:13px}.tabs button[hidden]{display:none}.tabs button.active{color:var(--accent);border-bottom-color:var(--accent)}
.right{margin-left:auto;display:flex;gap:8px;align-items:center}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:6px;background:var(--inset);color:var(--muted);font-size:11px;font-weight:600;font-family:var(--mono)}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid var(--border-strong);border-radius:8px;background:none;color:var(--text-2);cursor:pointer;font-size:12px}.btn:hover{background:var(--inset)}.btn:disabled{opacity:.4;cursor:default}
kbd{display:inline-flex;min-width:18px;height:18px;padding:0 4px;align-items:center;justify-content:center;border:1px solid var(--border-strong);border-radius:4px;font-family:var(--mono);font-size:10px;color:var(--muted)}
main{width:min(1440px,100%);margin:0 auto;padding:28px}.view[hidden]{display:none}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:clip}
.reader{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:600px}
.outline{border-right:1px solid var(--border);background:var(--bg)}.outline-inner{position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto;padding:20px 12px;display:flex;flex-direction:column;gap:2px}
.outline .label{margin:14px 10px 4px;color:var(--faint);font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.outline button{width:100%;padding:7px 10px;border:0;border-radius:8px;background:none;color:var(--text-2);cursor:pointer;text-align:left;font-size:13px;line-height:18px}.outline button:hover{background:var(--inset);color:var(--text)}.outline button.section{color:var(--text);font-weight:600}.outline button.active{background:var(--surface);color:var(--accent);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.outline button .dot{display:inline-block;width:7px;height:7px;margin-right:7px;border-radius:50%;background:var(--border-strong);vertical-align:middle}.outline button .dot.done{background:var(--ok)}
.document{min-width:0;padding:clamp(24px,4vw,56px)}
.doc-header{display:flex;align-items:baseline;justify-content:space-between;gap:24px;margin:0 0 24px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.doc-header h1{margin:0;font-family:var(--serif);font-size:30px;font-weight:400;line-height:40px;color:var(--heading)}.doc-header .meta{flex:none;color:var(--muted);font-size:12px;text-align:right;white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 24px;padding-bottom:16px;border-bottom:1px solid var(--border)}.pager .pos{color:var(--muted);font-size:12px}
.kicker{margin-bottom:4px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.markdown{max-width:840px;font-size:15px;line-height:1.7}.markdown>h2:first-of-type{margin-top:0}
.markdown h2{margin:36px 0 12px;font-size:22px;font-weight:500;color:var(--heading)}.markdown h3{margin:26px 0 8px;font-size:17px;font-weight:600;color:var(--heading)}.markdown h4{margin:18px 0 6px;font-size:11px;text-transform:uppercase;color:var(--muted)}
.markdown p{margin:0 0 14px}.markdown ul,.markdown ol{margin:0 0 16px;padding-left:24px}.markdown li{margin:5px 0}
.markdown blockquote{margin:16px 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--bg);color:var(--text-2)}
.markdown table{display:block;width:max-content;max-width:100%;margin:16px 0;overflow-x:auto;border-collapse:collapse}.markdown th,.markdown td{padding:8px 12px;border:1px solid var(--border);text-align:left;vertical-align:top}.markdown th{background:var(--bg);font-weight:600}
code{padding:2px 5px;border-radius:4px;background:var(--inset);font-family:var(--mono);font-size:.9em}.markdown pre{overflow:auto;padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--bg)}.markdown pre code{padding:0;background:none}
.markdown .mermaid{margin:20px 0;padding:14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);text-align:center;overflow-x:auto}
.hljs-keyword,.hljs-doctag,.hljs-type,.hljs-template-tag,.hljs-variable.language_{color:var(--k)}.hljs-title{color:var(--t)}.hljs-attr,.hljs-attribute,.hljs-literal,.hljs-meta,.hljs-number,.hljs-operator,.hljs-variable,.hljs-selector-class,.hljs-selector-id{color:var(--l)}.hljs-string,.hljs-regexp{color:var(--s)}.hljs-built_in,.hljs-symbol,.hljs-bullet{color:var(--v)}.hljs-comment,.hljs-code,.hljs-formula{color:var(--c)}.hljs-name,.hljs-quote,.hljs-selector-tag{color:var(--g)}.hljs-section{color:var(--l);font-weight:600}.hljs-emphasis{font-style:italic}.hljs-strong{font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--inset);color:var(--muted);font-size:12px;font-weight:600}
.pill.yes{background:var(--ok-bg);color:var(--ok)}.pill.no,.pill.partial{background:var(--bad-bg);color:var(--bad)}.pill.needs-human-review{background:var(--warn-bg);color:var(--warn)}.pill.followup{background:var(--accent-bg);color:var(--accent)}
.verdicts{display:grid;gap:8px;margin:0 0 20px;font-size:13px;color:var(--text-2)}.verdicts p{margin:0}.verdicts b{color:var(--text)}
.relations{display:grid;gap:4px;margin:10px 0 18px;padding:10px 12px;border-radius:6px;background:var(--bg);font-size:12px}.relations a{color:var(--accent);text-decoration:none}.relations a:hover{text-decoration:underline}.relations b{color:var(--muted);font-weight:500;margin-right:6px}
details.planned{margin:20px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg)}details.planned>summary{padding:10px 14px;cursor:pointer;font-weight:600;color:var(--heading)}details.planned>div{padding:4px 16px 8px;border-top:1px solid var(--border)}
.graph{overflow:auto;padding:20px;border:1px solid var(--border);border-radius:8px;background-color:var(--bg);background-image:radial-gradient(var(--border) .7px,transparent .7px);background-size:16px 16px}
.graph svg{display:block;margin:0 auto;height:auto;overflow:visible}.graph .node{cursor:pointer}.graph .node rect{fill:var(--surface)!important;stroke:var(--border-strong)!important;rx:8;ry:8}.graph .node.done rect{stroke:var(--ok)!important;stroke-width:2px!important}.graph .node .label,.graph .node text{fill:var(--text)!important;color:var(--text)!important}.graph .flowchart-link{stroke:var(--muted)!important}.graph marker path{fill:var(--muted)!important;stroke:var(--muted)!important}
.context{position:sticky;top:76px}.context h2{margin:0;padding:14px 18px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--heading)}.context .ask{margin:0;padding:14px 18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:22px;border-bottom:1px solid var(--border);max-height:40vh;overflow:auto}
.clar{padding:14px 18px;border-bottom:1px solid var(--border)}.clar:last-child{border-bottom:0}.clar .q{margin:0 0 6px;color:var(--text-2);font-size:13px}.clar .a{margin:0;white-space:pre-wrap;font-size:14px}.clar .a.custom::after{content:" (typed)";color:var(--faint);font-size:11px}.empty{padding:20px 18px;color:var(--muted);font-size:13px}
.errors{margin:0 0 20px;padding:14px 16px;border-radius:8px;background:var(--bad-bg);color:var(--bad);font-size:13px}.errors ul{margin:8px 0 0;padding-left:20px}.errors code{background:none;padding:0}
@media(max-width:1000px){.layout{grid-template-columns:1fr}.context{position:static}}
@media(max-width:720px){.reader{grid-template-columns:1fr}.outline{border-right:0;border-bottom:1px solid var(--border)}.outline-inner{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.outline .label{display:none}.document{padding:20px}.doc-header{flex-direction:column;gap:6px}}
</style>
</head>
<body>
<header class="app">
  <div class="brand">Implementation workflow</div>
  <nav class="tabs"><button data-view="plan">Plan</button><button data-view="review" id="review-tab" hidden>Review</button></nav>
  <div class="right"><span class="badge" id="workflow-id"></span><button class="btn" id="theme" type="button">Theme</button></div>
</header>
<main>
  <section class="view" id="plan-view">
    <div class="layout">
      <article class="card"><div class="reader">
        <nav class="outline"><div class="outline-inner" id="plan-outline"></div></nav>
        <div class="document">
          <div class="doc-header"><h1 id="plan-title"></h1><div class="meta" id="plan-meta"></div></div>
          <div class="pager"><button class="btn" id="plan-prev" type="button">← Previous <kbd>[</kbd></button><span class="pos" id="plan-pos"></span><button class="btn" id="plan-next" type="button">Next <kbd>]</kbd> →</button></div>
          <div class="markdown" id="plan-content"></div>
        </div>
      </div></article>
      <aside class="card context"><h2>Original ask</h2><pre class="ask" id="ask"></pre><h2>Clarifications</h2><div id="clarifications"></div></aside>
    </div>
  </section>
  <section class="view" id="review-view" hidden>
    <article class="card"><div class="reader">
      <nav class="outline"><div class="outline-inner" id="review-outline"></div></nav>
      <div class="document">
        <div class="doc-header"><h1>Implementation review</h1><div class="meta" id="review-meta"></div></div>
        <div class="pager"><button class="btn" id="review-prev" type="button">← Previous <kbd>[</kbd></button><span class="pos" id="review-pos"></span><button class="btn" id="review-next" type="button">Next <kbd>]</kbd> →</button></div>
        <div class="markdown" id="review-content"></div>
      </div>
    </div></article>
  </section>
</main>
<script type="application/json" id="data">__DATA__</script>
<script src="../assets/marked.umd.js"></script>
<script src="../assets/highlight.min.js"></script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const plan = data.plan, review = data.review;
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const numberOf = (slug) => plan ? plan.changes.findIndex((c) => c.slug === slug) + 1 : 0;
const changeBySlug = (slug) => plan && plan.changes.find((c) => c.slug === slug);

// ---------- markdown ----------
function renderer() {
  const r = new marked.Renderer();
  r.html = (t) => esc(t.text);
  r.code = (t) => {
    const lang = String(t.lang || "").trim().split(/\s+/)[0].toLowerCase();
    if (lang === "mermaid") return '<div class="mermaid">' + esc(t.text) + "</div>";
    let body = esc(t.text);
    try { if (lang && hljs.getLanguage(lang)) body = hljs.highlight(t.text, { language: lang, ignoreIllegals: true }).value; } catch {}
    return '<pre><code class="hljs">' + body + "</code></pre>";
  };
  r.link = function (t) {
    const text = this.parser.parseInline(t.tokens);
    let href = String(t.href || "");
    const m = /^(?:\.\.?\/)?(?:changes\/)?([a-z][a-z0-9-]*)\.md$/.exec(href);
    if (m && changeBySlug(m[1])) href = "#plan/change/" + m[1];
    if (/^\s*(javascript|vbscript|data):/i.test(href)) return text;
    return '<a href="' + esc(href) + '" rel="noopener noreferrer">' + text + "</a>";
  };
  return r;
}
const md = (s) => marked.parse(String(s || ""), { gfm: true, renderer: renderer() });

let mermaidPromise;
function mermaidLib() {
  if (globalThis.mermaid) return Promise.resolve(globalThis.mermaid);
  return mermaidPromise ??= new Promise((res, rej) => { const s = document.createElement("script"); s.src = new URL("../assets/mermaid.min.js", location.href).href; s.onload = () => res(globalThis.mermaid); s.onerror = () => rej(new Error("Could not load Mermaid")); document.head.appendChild(s); });
}
async function runMermaid(root) {
  const nodes = [...root.querySelectorAll(".mermaid:not([data-processed])")];
  if (!nodes.length) return;
  try {
    const lib = await mermaidLib();
    lib.initialize({ startOnLoad: false, securityLevel: "strict", theme: document.documentElement.dataset.theme === "dark" ? "dark" : "default" });
    await lib.run({ nodes, suppressErrors: true });
  } catch (e) { for (const n of nodes) n.title = e.message; }
}

// ---------- verdict helpers ----------
const label = (s) => s === "needs-human-review" ? "Needs human review" : s[0].toUpperCase() + s.slice(1);
const pills = (v) => '<div class="pills">' + ["necessary", "sufficient", "testing"].map((k) => '<span class="pill ' + v[k].status + '">' + k[0].toUpperCase() + k.slice(1) + ": " + label(v[k].status) + "</span>").join("") + "</div>";
const explanations = (v) => '<div class="verdicts">' + ["necessary", "sufficient", "testing"].map((k) => "<p><b>" + k[0].toUpperCase() + k.slice(1) + ".</b> " + esc(v[k].explanation) + "</p>").join("") + "</div>";
const errorBox = (title, errors) => '<div class="errors"><b>' + esc(title) + "</b><ul>" + errors.map((e) => "<li><code>" + esc(e) + "</code></li>").join("") + "</ul></div>";

// ---------- plan sections ----------
function changeHeader(c) {
  const enables = plan.changes.filter((o) => o.dependsOn.includes(c.slug));
  const links = (list) => list.length ? list.map((o) => '<a href="#plan/change/' + o.slug + '">' + numberOf(o.slug) + ". " + esc(o.title) + "</a>").join(", ") : "none";
  return '<div class="kicker">Change ' + numberOf(c.slug) + " · <code>" + c.slug + "</code></div><h2>" + esc(c.title) + "</h2>" +
    '<div class="pills"><span class="pill ' + (c.implemented ? "yes" : "") + '">' + (c.implemented ? "Marked implemented" : "Not marked implemented") + "</span>" + (c.followup ? '<span class="pill followup">Followup</span>' : "") + "</div>" +
    '<div class="relations"><span><b>Requires</b>' + links(c.dependsOn.map(changeBySlug).filter(Boolean)) + "</span><span><b>Enables</b>" + links(enables) + "</span></div>";
}
function graphSource() {
  const lines = ["flowchart LR"];
  plan.changes.forEach((c, i) => lines.push("  n" + i + '["' + (i + 1) + ". " + c.title.replace(/["\\]/g, "'") + '"]' + (c.implemented ? ":::done" : "")));
  plan.changes.forEach((c, i) => c.dependsOn.forEach((d) => { const j = plan.changes.findIndex((o) => o.slug === d); if (j >= 0) lines.push("  n" + j + " --> n" + i); }));
  lines.push("  classDef done stroke-width:2px");
  return lines.join("\n");
}
function planSections() {
  if (!plan) return [{ id: "errors", label: "Plan status", section: true, html: () => errorBox("The plan directory is not valid yet. The agent must fix these before the plan can be used:", data.planErrors) }];
  const s = [{ id: "goal", label: "Goal", section: true, html: () => '<div class="kicker">Goal</div>' + md(plan.goal) }];
  if (plan.intro) s.push({ id: "intro", label: "Introduction", section: true, html: () => '<div class="kicker">Introduction</div>' + md(plan.intro) });
  s.push({ id: "graph", label: "Dependency graph", section: true, html: () => '<div class="kicker">Dependency graph</div><p>Arrows point from prerequisites to the changes that need them. Select a node to open it.</p><div class="graph"><div class="mermaid">' + esc(graphSource()) + "</div></div>" });
  s.push({ id: "changes", label: "Changes", group: true });
  for (const c of plan.changes) s.push({ id: "change/" + c.slug, label: numberOf(c.slug) + ". " + c.title, done: c.implemented, html: () => changeHeader(c) + md(c.content) });
  s.push({ id: "testing", label: "Testing", section: true, html: () => '<div class="kicker">End-to-end testing</div>' + md(plan.testing) });
  return s;
}
function reviewSections() {
  if (!review) return data.reviewErrors.length ? [{ id: "errors", label: "Review status", section: true, html: () => errorBox("The review directory is not valid yet:", data.reviewErrors) }] : [];
  const s = [{ id: "overall", label: "Overall result", section: true, html: () => '<div class="kicker">Overall</div>' + pills(review.overall) + explanations(review.overall) + md(review.summary) }];
  s.push({ id: "changes", label: "Changes", group: true });
  for (const r of review.changes) {
    const c = changeBySlug(r.slug);
    s.push({ id: "change/" + r.slug, label: numberOf(r.slug) + ". " + c.title, done: r.necessary.status === "yes" && r.sufficient.status === "yes" && r.testing.status === "yes", html: () =>
      '<div class="kicker">Change ' + numberOf(r.slug) + " · <code>" + r.slug + "</code></div><h2>" + esc(c.title) + "</h2>" + pills(r) + explanations(r) +
      '<details class="planned"><summary>Planned change</summary><div>' + md(c.content) + "</div></details>" +
      '<h3>What was implemented</h3>' + md(r.content) });
  }
  return s;
}

// ---------- reader ----------
function reader(name, sections) {
  const outline = $(name + "-outline"), content = $(name + "-content"), pos = $(name + "-pos");
  const pages = sections.filter((s) => !s.group);
  let current = 0;
  outline.innerHTML = sections.map((s) => s.group ? '<div class="label">' + esc(s.label) + "</div>" : '<button type="button" class="' + (s.section ? "section" : "") + '" data-id="' + esc(s.id) + '">' + (s.done !== undefined ? '<span class="dot ' + (s.done ? "done" : "") + '"></span>' : "") + esc(s.label) + "</button>").join("");
  outline.addEventListener("click", (e) => { const b = e.target.closest("button[data-id]"); if (b) location.hash = "#" + name + "/" + b.dataset.id; });
  $(name + "-prev").addEventListener("click", () => go(current - 1));
  $(name + "-next").addEventListener("click", () => go(current + 1));
  function go(i) { if (i >= 0 && i < pages.length) location.hash = "#" + name + "/" + pages[i].id; }
  function show(id) {
    const i = Math.max(0, pages.findIndex((p) => p.id === id));
    current = i;
    if (!pages.length) { content.innerHTML = '<div class="empty">Nothing here yet.</div>'; return; }
    content.innerHTML = pages[i].html();
    for (const b of outline.querySelectorAll("button")) b.classList.toggle("active", b.dataset.id === pages[i].id);
    pos.textContent = (i + 1) + " / " + pages.length;
    $(name + "-prev").disabled = i === 0; $(name + "-next").disabled = i === pages.length - 1;
    content.scrollIntoView({ block: "start" }); window.scrollTo({ top: 0 });
    runMermaid(content).then(() => wireGraph(content));
  }
  return { show, go: (d) => go(current + d), pages };
}
function wireGraph(root) {
  const svg = root.querySelector(".graph svg");
  if (!svg || !plan) return;
  for (const node of svg.querySelectorAll(".node")) {
    const m = /flowchart-n(\d+)-/.exec(node.id);
    if (!m) continue;
    const c = plan.changes[Number(m[1])];
    if (c.implemented) node.classList.add("done");
    node.addEventListener("click", () => { location.hash = "#plan/change/" + c.slug; });
  }
}

// ---------- boot ----------
$("workflow-id").textContent = data.id;
$("plan-title").textContent = plan ? plan.title : data.id;
if (plan) { const done = plan.changes.filter((c) => c.implemented).length; $("plan-meta").textContent = done + " / " + plan.changes.length + " marked implemented" + (plan.changes.some((c) => c.followup) ? " · " + plan.changes.filter((c) => c.followup).length + " followups" : ""); }
$("ask").textContent = data.ask;
$("clarifications").innerHTML = data.clarifications.length ? data.clarifications.map((c) => '<div class="clar"><p class="q">' + esc(c.question) + '</p><p class="a' + (c.custom ? " custom" : "") + '">' + esc(c.answer) + "</p></div>").join("") : '<div class="empty">No clarifications recorded.</div>';
const readers = { plan: reader("plan", planSections()), review: reader("review", reviewSections()) };
if (review || data.reviewErrors.length) { $("review-tab").hidden = false; if (review) $("review-meta").textContent = (review.baseCommit || "").slice(0, 10) + " → " + (review.headCommit || "").slice(0, 10) + (review.reviewedAt ? " · " + new Date(review.reviewedAt).toLocaleString() : ""); }
let view = "plan";
function route() {
  const [v, ...rest] = location.hash.replace(/^#/, "").split("/");
  view = v === "review" && !$("review-tab").hidden ? "review" : "plan";
  for (const b of document.querySelectorAll(".tabs button")) b.classList.toggle("active", b.dataset.view === view);
  $("plan-view").hidden = view !== "plan"; $("review-view").hidden = view !== "review";
  readers[view].show(rest.join("/") || readers[view].pages[0]?.id);
}
document.querySelector(".tabs").addEventListener("click", (e) => { const b = e.target.closest("button[data-view]"); if (b) location.hash = "#" + b.dataset.view; });
window.addEventListener("hashchange", route);
document.addEventListener("keydown", (e) => { if (e.target.closest("input,textarea,select") || e.metaKey || e.ctrlKey || e.altKey) return; if (e.key === "[") readers[view].go(-1); if (e.key === "]") readers[view].go(1); });
const themeKey = "implementation-workflow-theme";
function applyTheme(t) { document.documentElement.dataset.theme = t; localStorage.setItem(themeKey, t); route(); }
document.documentElement.dataset.theme = localStorage.getItem(themeKey) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
$("theme").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));
route();
// Reload when the file on disk changed, checked whenever the tab regains focus.
const revision = document.querySelector('meta[name="workflow-revision"]').content;
async function checkRevision() { try { const html = await (await fetch(location.pathname, { cache: "no-store" })).text(); const m = /workflow-revision" content="([^"]+)"/.exec(html); if (m && m[1] !== revision) location.reload(); } catch {} }
window.addEventListener("focus", checkRevision);
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkRevision(); });
</script>
